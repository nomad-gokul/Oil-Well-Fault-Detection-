name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only PyTorch)
        run: make install-all PYTHON=python
      - name: Lint and type-check
        run: make lint
      - name: Tests with coverage
        run: .venv/bin/pytest -p no:warnings --cov=owfd --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (production model from deploy/bundle)
        run: docker buildx build --load -f docker/api.Dockerfile -t owfd-api:ci .
      - name: Build dashboard image
        run: docker buildx build --load -f docker/dashboard.Dockerfile -t owfd-dashboard:ci .
      - name: Smoke test the API image
        run: |
          docker run -d --name api -p 8000:8000 -e OWFD_API_KEY=ci owfd-api:ci
          bash scripts/smoke_test.sh http://localhost:8000
          docker run --rm --entrypoint python owfd-api:ci -c "import importlib.util as u, sys; sys.exit(u.find_spec('torch') is not None)"
          docker image inspect owfd-api:ci --format '{{.Size}}' | awk '{printf "API image: %.0f MB\n", $1/1e6; exit ($1 > 600e6)}'
