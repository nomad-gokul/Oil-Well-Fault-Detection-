name: Release

# Publishing a GitHub Release builds and pushes the images. Attach the serving bundle to the
# release first:  make bundle-tarball  ->  upload build/serving-bundle.tar.gz as a release asset.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose serving-bundle.tar.gz to use
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the serving bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern serving-bundle.tar.gz --dir build
          mkdir -p build/bundle && tar -xzf build/serving-bundle.tar.gz -C build/bundle
          cat build/bundle/manifest.json | head -c 300
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/$owner/owfd-api" >> "$GITHUB_OUTPUT"
          echo "dashboard=ghcr.io/$owner/owfd-dashboard" >> "$GITHUB_OUTPUT"
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ env.TAG }}
            ${{ steps.names.outputs.api }}:latest
            ${{ steps.names.outputs.api }}:sha-${{ github.sha }}
      - name: Build and push the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.dashboard }}:${{ env.TAG }}
            ${{ steps.names.outputs.dashboard }}:latest
      - name: Trigger the Render deploy (if configured)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" && echo "Render deploy triggered"; else echo "RENDER_DEPLOY_HOOK_URL not set; skipping"; fi
