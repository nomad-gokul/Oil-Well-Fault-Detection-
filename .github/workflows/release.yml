name: Release

# Publishing a GitHub Release (or running this workflow by hand) builds the images with the
# production model committed in deploy/bundle and pushes them to GitHub Container Registry.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || format('manual-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/$owner/owfd-api" >> "$GITHUB_OUTPUT"
          echo "dashboard=ghcr.io/$owner/owfd-dashboard" >> "$GITHUB_OUTPUT"
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ env.TAG }}
            ${{ steps.names.outputs.api }}:latest
            ${{ steps.names.outputs.api }}:sha-${{ github.sha }}
      - name: Build and push the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.dashboard }}:${{ env.TAG }}
            ${{ steps.names.outputs.dashboard }}:latest
      - name: Trigger the Render deploy (if configured)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" && echo "Render deploy triggered"; else echo "RENDER_DEPLOY_HOOK_URL not set; skipping"; fi
