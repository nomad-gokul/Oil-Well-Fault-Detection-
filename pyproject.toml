[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owfd"
version = "0.1.0"
description = "Oil Well Fault Detection: ML early-warning system for offshore oil wells (Petrobras 3W)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "torch>=2.2", "optuna>=3.6", "shap>=0.45", "mlflow>=2.12", "onnx>=1.16", "onnxruntime>=1.17", "matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "xgboost>=2.0", "onnxruntime>=1.17"]
dashboard = ["streamlit>=1.35", "plotly>=5.20", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["owfd"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
